# Netlify 部署配置
# ------------------------------------------------------------
# 用法（三种任选一种）：
#   1. 打开 https://app.netlify.com/drop ，把整个文件夹拖进去
#   2. 或把这个文件夹连到 GitHub，Netlify 会自动读这个配置
#
# 站点地址：https://你的项目名.netlify.app
# 自定义域名：Netlify 后台 → Domain settings → Add custom domain

[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# 缓存规则：HTML 每次都取最新的，图片和 CSS 可以缓存久一点
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 强制 HTTPS（Netlify 默认就有，这里写出来更明确）
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

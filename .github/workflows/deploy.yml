# ============================================================
# GitHub Pages 部署（经典分支方式）
# ------------------------------------------------------------
# 为什么用这个方式：
#   默认的 deploy-pages 动作会走 github-pages 环境，
#   而这个环境可能带分支保护规则（protected_branches / custom_branch_policies），
#   一旦策略里没放行当前分支，就会报：
#     "Branch main is not allowed to deploy to github-pages
#      due to environment protection rules."
#
#   经典方式直接把文件推到 gh-pages 分支，完全不走环境，稳得多。
#
# 部署结果：
#   https://cwywlp-mo2026.github.io/coloring/
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 只允许一个部署任务，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成静态页面
        run: npm run build

      - name: 整理待发布文件
        run: |
          mkdir -p _site
          # 只要网站真正需要的文件，别把构建脚本和说明文档传上去
          cp -r index.html paint.html css js img paint _site/
          cp sitemap.xml robots.txt .nojekyll _site/
          ls -la _site

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: 推送到 gh-pages 分支
        run: |
          cd _site
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: $(date -u +'%Y-%m-%d %H:%M:%S')"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:gh-pages

      - name: 启用 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 发布
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

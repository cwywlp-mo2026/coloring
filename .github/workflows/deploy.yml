# ============================================================
# GitHub Pages 部署配置
# ------------------------------------------------------------
# 仓库名    : 你的用户名.github.io
# 站点地址  : https://你的用户名.github.io/仓库名/
#
# 第一次用：
#   1. 在 GitHub 上新建一个仓库（Public）
#   2. 把这个文件夹里的所有文件推上去
#   3. Settings → Pages → Source 选 "GitHub Actions"
#   4. 推上去后等 1 分钟，网站就上线了
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个部署任务，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 生成静态页面
        run: npm run build

      - name: 整理待发布文件
        run: |
          mkdir -p _site
          # 只要网站真正需要的文件，别把构建脚本和说明文档传上去
          cp -r index.html paint.html css js img paint _site/
          cp sitemap.xml robots.txt .nojekyll _site/
          ls -la _site

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
